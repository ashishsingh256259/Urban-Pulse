<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <!-- Outer Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Light Cyan Glow Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Buildings Gradient -->
    <linearGradient id="bldgGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Pulse Line Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Border Frame -->
  <path d="M256 32 C350 70 440 85 450 170 C460 285 380 405 256 480 C132 405 52 285 62 170 C72 85 162 70 256 32 Z" 
        fill="url(#shieldGrad)" />

  <!-- Inner Shield Fill (Slight Inset) -->
  <path d="M256 48 C338 82 420 96 430 172 C438 274 366 382 256 452 C146 382 74 274 82 172 C92 96 174 82 256 48 Z" 
        fill="#0F172A" opacity="0.95" />

  <!-- City Skyline Silhouette -->
  <!-- Building 1 (Far Left) -->
  <rect x="150" y="240" width="28" height="90" rx="2" fill="url(#bldgGrad)" />
  <rect x="156" y="250" width="6" height="8" fill="#38BDF8" opacity="0.8" />
  <rect x="166" y="250" width="6" height="8" fill="#38BDF8" opacity="0.8" />
  <rect x="156" y="266" width="6" height="8" fill="#38BDF8" opacity="0.8" />
  <rect x="166" y="266" width="6" height="8" fill="#38BDF8" opacity="0.8" />

  <!-- Building 2 -->
  <rect x="185" y="200" width="34" height="130" rx="3" fill="url(#bldgGrad)" />
  <rect x="193" y="212" width="7" height="10" fill="#60A5FA" opacity="0.8" />
  <rect x="204" y="212" width="7" height="10" fill="#60A5FA" opacity="0.8" />
  <rect x="193" y="230" width="7" height="10" fill="#60A5FA" opacity="0.8" />
  <rect x="204" y="230" width="7" height="10" fill="#60A5FA" opacity="0.8" />

  <!-- Center Main Tower -->
  <path d="M232 140 L280 140 L280 330 L232 330 Z" fill="url(#bldgGrad)" />
  <polygon points="256,105 232,140 280,140" fill="#38BDF8" />
  <circle cx="256" cy="170" r="7" fill="#38BDF8" />
  <circle cx="256" cy="170" r="3" fill="#FFFFFF" />
  <rect x="242" y="195" width="8" height="12" fill="#93C5FD" opacity="0.85" />
  <rect x="262" y="195" width="8" height="12" fill="#93C5FD" opacity="0.85" />
  <rect x="242" y="218" width="8" height="12" fill="#93C5FD" opacity="0.85" />
  <rect x="262" y="218" width="8" height="12" fill="#93C5FD" opacity="0.85" />

  <!-- Building 4 -->
  <rect x="290" y="190" width="36" height="140" rx="3" fill="url(#bldgGrad)" />
  <rect x="298" y="205" width="8" height="10" fill="#38BDF8" opacity="0.8" />
  <rect x="310" y="205" width="8" height="10" fill="#38BDF8" opacity="0.8" />
  <rect x="298" y="222" width="8" height="10" fill="#38BDF8" opacity="0.8" />
  <rect x="310" y="222" width="8" height="10" fill="#38BDF8" opacity="0.8" />

  <!-- Building 5 (Far Right) -->
  <rect x="334" y="230" width="30" height="100" rx="2" fill="url(#bldgGrad)" />
  <rect x="340" y="242" width="6" height="8" fill="#60A5FA" opacity="0.8" />
  <rect x="350" y="242" width="6" height="8" fill="#60A5FA" opacity="0.8" />

  <!-- Pulse Wave Line Across City -->
  <path d="M80 285 L140 285 L180 270 L210 280 L256 220 L300 290 L335 275 L370 285 L432 285" 
        stroke="url(#cyanGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Pulse Wave Nodes (Glowing Circles) -->
  <circle cx="140" cy="285" r="8" fill="#0284C7" stroke="#38BDF8" stroke-width="3" />
  <circle cx="140" cy="285" r="3" fill="#FFFFFF" />

  <circle cx="210" cy="280" r="8" fill="#0284C7" stroke="#38BDF8" stroke-width="3" />
  <circle cx="210" cy="280" r="3" fill="#FFFFFF" />

  <circle cx="256" cy="220" r="10" fill="#0284C7" stroke="#38BDF8" stroke-width="4" />
  <circle cx="256" cy="220" r="4" fill="#FFFFFF" />

  <circle cx="335" cy="275" r="8" fill="#0284C7" stroke="#38BDF8" stroke-width="3" />
  <circle cx="335" cy="275" r="3" fill="#FFFFFF" />

  <!-- Winding Roads at Shield Base -->
  <path d="M120 330 C180 330 210 410 256 448 C302 410 332 330 392 330 C330 360 290 440 256 448 C222 440 182 360 120 330 Z" 
        fill="url(#cyanGlow)" opacity="0.9" />

  <path d="M256 310 L256 448" stroke="#38BDF8" stroke-width="4" stroke-dasharray="8 6" opacity="0.8" />
  <path d="M190 330 C220 370 240 420 256 448" stroke="#60A5FA" stroke-width="3" opacity="0.7" />
  <path d="M322 330 C292 370 272 420 256 448" stroke="#60A5FA" stroke-width="3" opacity="0.7" />
</svg>
